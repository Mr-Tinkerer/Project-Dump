; ~/Projects/LLMs/presets.ini  -  laptop (RTX 5060 8GB, i7-13620H, 32 GB RAM)
;     --models-preset %h/Projects/LLMs/presets.ini --api-key ""
; n-gpu-layers is never set: --fit (default on) picks the layer count from free VRAM.
; Context sizes ARE set on every entry so fit trims layers instead of silently shrinking context.

[*]
; Leave ~512 MiB of VRAM free per device instead of the 1024 default. The display runs on the
; Intel iGPU, so the RTX should be mostly free. If you see CUDA OOM mid-chat, remove this line.
fit-target = 512
; One thread per P-core (13620H = 6P + 4E). Only matters for layers that spill to the CPU.
threads = 6

; ============================================================
; Gemma-3-1B
; Context tiers are capped at the trained 32K (32768), not the 262144 that fits in VRAM.
; ============================================================
[gemma-3-1b-Small]
model = /home/pengmania/Projects/LLMs/models/gemma-3-1b-it-Q4_K_M.gguf
ctx-size = 10922
; ; Low temperature = more reliable short/structured output for background tasks.
; temp = 0.3
; top-k = 64
; top-p = 0.95

[gemma-3-1b-Medium]
model = /home/pengmania/Projects/LLMs/models/gemma-3-1b-it-Q4_K_M.gguf
ctx-size = 21845
; ; Low temperature = more reliable short/structured output for background tasks.
; temp = 0.3
; top-k = 64
; top-p = 0.95

[gemma-3-1b-Max]
model = /home/pengmania/Projects/LLMs/models/gemma-3-1b-it-Q4_K_M.gguf
ctx-size = 32768
