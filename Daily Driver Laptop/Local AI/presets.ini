; ============================================================
; Gemma 4 E4B. lazy-mode=on reads the large per-layer-embedding tensors from disk on
; demand instead of keeping them resident, freeing VRAM/RAM (requires mmap, the default).
; KV cache left at f16 and flash-attn at auto: not verified that Gemma 4's attention
; head sizes support quantized KV on this build.
; Sampler values are Google's standard Gemma 4 set.
; Context tiers are capped at the trained 128K (131072), not the ~185K that fits in VRAM.
; ============================================================
[Gemma-4-E4B-Small]
model = /home/pengmania/Projects/LLMs/models/gemma-4-E4B-it-Q4_K_M.gguf
mmproj = /home/pengmania/Projects/LLMs/models/gemma-4-E4B-it-mmproj-BF16.gguf
ctx-size = 43690
lazy-mode = on
ubatch-size = 1024
reasoning = off
reasoning-budget = 0
temp = 1.0
top-p = 0.95
top-k = 64

