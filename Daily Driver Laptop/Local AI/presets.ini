; /home/pengmania/LLMs/models/presets.ini
; Used with: llama-server --models-dir /home/pengmania/LLMs/models --models-preset /home/pengmania/LLMs/models/presets.ini
; Section names must match the model names shown by GET /v1/models exactly.
; Model names below are copied from the OptiPlex setup - adjust if the laptop's files/folders are named differently.

; ---- Defaults for every model ----
[*]
n-gpu-layers = 999
threads = 6
n-predict = -1
parallel = 1
no-kv-offload = true

; ---- Embedding role (was port 9932) ----
; Explicit path, same reason as on the OptiPlex (embeddings folder holds several GGUFs).
[Qwen3-Embedding-0.6B-f16]
model = /home/pengmania/Projects/LLMs/models/embeddings/Qwen3-Embedding-0.6B-f16.gguf
embedding = true
ctx-size = 8192
batch-size = 4096
ubatch-size = 4096

; ---- Extraction / answer LLM, thinking off (was port 9933) ----
[Qwen3.5-4B-Q4_K_M]
ctx-size = 16384
reasoning = off
reasoning-budget = 0

; ---- Optional: same weights with thinking ON (was the old 9931 behaviour) ----
; Uncomment if you still want a reasoning variant; point model= at the real file.
[Qwen3.5-4B-thinking]
model = /home/pengmania/Projects/LLMs/models/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 16384

; ---- VLM ----
[Qwen2.5-VL-3B-Instruct]
ctx-size = 16384
