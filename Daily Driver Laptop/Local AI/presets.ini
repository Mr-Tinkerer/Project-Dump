; ============================================================
; Embedding model for LightRAG
; ============================================================
[LightRAG-Embedding]
model = /home/pengmania/Projects/LLMs/models/Qwen3-Embedding-0.6B-f16.gguf
embedding = true
ctx-size = 8192
; Embedding inputs must fit in ONE physical batch, so ubatch >= largest chunk.
batch-size = 4096
ubatch-size = 4096
; No chat history to cache for embeddings.
cache-ram = 0

; ============================================================
; Logic model for LightRAG
