; /home/ai/presets.ini
; Run WITHOUT --models-dir:
;   llama-server --host 127.0.0.1,10.10.0.5 --port 9931 --no-ui \
;     --sleep-idle-seconds 300 --models-max 2 \
;     --models-preset /home/ai/presets.ini --api-key "<key>"
; Section names must match the model names sent by clients exactly (case-sensitive).

; ===================================================================
; DEFAULTS
; ===================================================================
[*]
; Matches the 4-core pin; generation saturates at 3-4 threads (Runs #4/#5).
threads = 4
threads-batch = 4
; Single user. Extra slots only divide ctx-size.
parallel = 1
n-predict = -1
; CPU-only: don't let --fit rewrite explicit values.
fit = off
; Default is 8192 MiB, which equals this VM's total RAM.
cache-ram = 512
; Default is 32 per slot; checkpoints cost RAM on SWA/hybrid models.
ctx-checkpoints = 4
ctx-size = 16384
; KV cache stays f16: quantized K or V cost ~40-47% of pp speed (benchmarked).
; Load mode stays default (mmap). Do not use mlock on 8 GB.

; ===================================================================
; PART 1: GENERIC MODEL PRESETS (one per file on disk)
; ===================================================================

[qwen3-embedding-0.6b-f16]
model = /home/ai/models/Qwen3-Embedding-0.6B-f16.gguf
embedding = true
ctx-size = 8192
; Whole input must fit one physical batch.
batch-size = 4096
ubatch-size = 4096
cache-ram = 0

[qwen3.5-2b]
model = /home/ai/models/Qwen3.5-2B-Q4_K_M.gguf

[qwen3.5-4b]
model = /home/ai/models/Qwen3.5-4B-Q4_K_M.gguf

[qwen2.5-3b]
model = /home/ai/models/Qwen2.5-3B-Instruct-Q4_K_M.gguf
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05

[qwen2.5-vl-3b]
model = /home/ai/models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
mmproj = /home/ai/models/Qwen2.5-VL-3B-Instruct-mmproj-F16.gguf

[gemma-3-1b]
model = /home/ai/models/gemma-3-1b-it-Q4_K_M.gguf
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0.0

[gemma-3-4b]
model = /home/ai/models/gemma-3-4b-it-Q4_K_M.gguf
mmproj = /home/ai/models/gemma-3-4b-it-mmproj-Q4_K_M.gguf
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0.0

[gemma-4-e2b]
model = /home/ai/models/gemma-4-E2B-it-Q4_K_M.gguf
; Sampling: take from the Gemma 4 model card.

[gemma-4-e4b]
model = /home/ai/models/gemma-4-E4B-it-Q4_K_M.gguf
; 4.6 GiB resident: the only model that gets a smaller context.
ctx-size = 8192
; Sampling: take from the Gemma 4 model card.

; ===================================================================
; PART 2: ROLE PRESETS (names match the LightRAG .env)
; ===================================================================
; Paths are duplicated rather than inherited, since I don't know whether
; the parser supports inheritance. Don't load a role and its generic twin
; together: the router counts them as two models and pays the RAM twice.

[LightRAG-Embedding]
model = /home/ai/models/Qwen3-Embedding-0.6B-f16.gguf
embedding = true
; Chunks are ~2,000 tokens; 4096 halves the KV cache.
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
cache-ram = 0

[LightRAG-Logic]
model = /home/ai/models/Qwen3.5-4B-Q4_K_M.gguf
; MAX_EXTRACT_INPUT_TOKENS 8000 + output 5120 + prompt overhead.
ctx-size = 16384
reasoning = off
reasoning-budget = 0
; Judgment call: extraction wants consistent JSON. Compare with the default
; 0.8 if format errors return.
temp = 0.3
cache-ram = 512

[LightRAG-Vision]
model = /home/ai/models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
mmproj = /home/ai/models/Qwen2.5-VL-3B-Instruct-mmproj-F16.gguf
ctx-size = 16384
