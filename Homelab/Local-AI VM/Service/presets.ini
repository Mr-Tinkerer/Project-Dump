; /home/ai/models/presets.ini
; Used with: llama-server --models-dir /home/ai/models --models-preset /home/ai/models/presets.ini
; Section names must match the model names shown by GET /v1/models exactly.
; Key names mirror the CLI long flags without the leading dashes - verify against `llama-server --help`.

; ---- Defaults for every model ----
[*]
threads = 4
n-predict = -1
parallel = 1

; ---- Embedding role (was port 9932) ----
; Explicit path, because the embeddings folder holds three GGUFs and
; the router could mistake that subfolder for a multimodal bundle.
[Qwen3-Embedding-0.6B-f16]
model = /home/ai/models/embeddings/Qwen3-Embedding-0.6B-f16.gguf
embedding = true
ctx-size = 8192
batch-size = 4096
ubatch-size = 4096

; ---- Extraction / answer LLM (was port 9933) ----
[Qwen3.5-4B-Q4_K_M]
ctx-size = 16384
reasoning = off
reasoning-budget = 0

; ---- VLM (was port 9931) ----
; Folder contains the model GGUF plus mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf
[Qwen2.5-VL-3B-Instruct]
ctx-size = 16384
