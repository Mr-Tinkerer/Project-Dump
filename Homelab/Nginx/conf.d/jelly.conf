server {
    #port and domain name
    listen 80;
    server_name jelly.uhhhhh;

    #redirect all http request to https
    return 301 https://$host$request_uri;
}


server {
    #port and domain name
    listen 443 ssl;
    server_name jelly.uhhhhh;

    #log the access and error for this site
    access_log /var/log/nginx/jelly-access.log;
    error_log /var/log/nginx/jelly-error.log;

    #ssl certificate keys
    ssl_certificate /etc/certs/jelly.uhhhhh.crt; #public
    ssl_certificate_key /etc/certs/jelly.uhhhhh.key; #private

    #ssl protocals support
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    #what encryption algorithms to be used
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security / XSS Mitigation Headers
    add_header X-Content-Type-Options "nosniff";

    # Permissions policy. May cause issues with some clients
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

    # Content Security Policy
    # See: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    # Enforces https content and restricts JS/CSS to origin
    # External Javascript (such as cast_sender.js for Chromecast) must be whitelisted.
    add_header Content-Security-Policy "default-src https: data: blob: ; img-src 'self' https://* ; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.youtube.com blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; font-src 'self'";

    location / {
        #redirect to the new server
        proxy_pass http://10.10.0.6:8096;


        #pass the request headers for the host name and ip
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        #websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;

        #keep the orginal ip address
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #keep the orginal http or https request
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket {
        # Proxy Jellyfin Websockets traffic
        proxy_pass http://10.10.0.6:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
