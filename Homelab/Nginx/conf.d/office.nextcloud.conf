server {
    #port and domain name
    listen 80;
    server_name office.nextcloud.uhhhhh;

    #log the access and error for this site
    access_log /var/log/nginx/office.nextcloud-access.log;
    error_log /var/log/nginx/office.nextcloud-error.log;

    #redirect all http request to https
    return 301 http://$host$request_uri;
}


server {
    #port and domain name
    listen 443 ssl;
    server_name office.nextcloud.uhhhhh;

    #log the access and error for this site
    access_log /var/log/nginx/office.nextcloud-access.log;
    error_log /var/log/nginx/office.nextcloud-error.log;

    #ssl certificate keys
    ssl_certificate /etc/certs/office.nextcloud.uhhhhh.crt; #public
    ssl_certificate_key /etc/certs/office.nextcloud.uhhhhh.key; #private

    #ssl protocals support
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    #what encryption algorithms to be used
    ssl_ciphers HIGH:!aNULL:!MD5;

    # static files
    location ^~ /browser {
        proxy_pass https://10.10.0.2:9980;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }


    # WOPI discovery URL
    location ^~ /hosting/discovery {
        proxy_pass https://10.10.0.2:9980;
        proxy_set_header Host $host;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }


    # Capabilities
    location ^~ /hosting/capabilities {
        proxy_pass https://10.10.0.2:9980;
        proxy_set_header Host $host;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

    # main websocket, download, presentation (legacy svg) and image upload
    location ^~ /cool/ {
        proxy_pass https://10.10.0.2:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 36000s;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 36000s;
    }


    # health checks, used since 26.04.3.1 by load balancers and monitoring
    location ^~ /livez {
        proxy_pass https://10.10.0.2:9980;
        proxy_set_header Host $host;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }


    location ^~ /readyz {
        proxy_pass https://10.10.0.2:9980;
        proxy_set_header Host $host;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

